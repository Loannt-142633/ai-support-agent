services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_support_agent
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_support_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  migrate:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/ai_support_agent
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  rabbitmq-setup:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "app.messaging.setup_topology"]
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/ai_support_agent
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
      DOCUMENT_STORAGE_DIR: /app/uploads/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq-setup:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
  worker:
    build:
      context: .
      target: worker
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/ai_support_agent
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
      DOCUMENT_STORAGE_DIR: /app/uploads/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq-setup:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads

volumes:
  postgres_data:
  rabbitmq_data:
  uploads_data:
