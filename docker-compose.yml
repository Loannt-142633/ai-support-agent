services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: ai_support_agent
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d ai_support_agent"]
      interval: 5s
      timeout: 5s
      retries: 5
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: app
      RABBITMQ_DEFAULT_PASS: app
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "check_port_connectivity"]
      interval: 5s
      timeout: 5s
      retries: 12
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
  kafka-volume-init:
    image: apache/kafka:3.9.1
    user: "0"
    entrypoint: ["/bin/sh", "-c"]
    command: ["chown -R 1000:1000 /tmp/kraft-combined-logs"]
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
  kafka:
    image: apache/kafka:3.9.1
    depends_on:
      kafka-volume-init:
        condition: service_completed_successfully
    environment:
      KAFKA_NODE_ID: 1
      CLUSTER_ID: 4L6g3nShT-eMCtK--X86sw
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_LISTENERS: INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:9094
      KAFKA_ADVERTISED_LISTENERS: INTERNAL://kafka:9092,EXTERNAL://localhost:9094
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: INTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
    ports:
      - "9094:9094"
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 >/dev/null 2>&1"]
      interval: 10s
      timeout: 10s
      retries: 15
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
  kafka-setup:
    image: apache/kafka:3.9.1
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/opt/kafka/bin/kafka-topics.sh"]
    command: ["--bootstrap-server", "kafka:9092", "--create", "--if-not-exists", "--topic", "${TICKET_CREATED_TOPIC:-ticket.created}", "--partitions", "3", "--replication-factor", "1"]
  migrate:
    build:
      context: .
      target: base
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/ai_support_agent
    depends_on:
      db:
        condition: service_healthy
    command: ["alembic", "upgrade", "head"]
  rabbitmq-setup:
    build:
      context: .
      target: base
    env_file: .env
    environment:
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
      RABBITMQ_MANAGEMENT_URL: http://rabbitmq:15672
    depends_on:
      rabbitmq:
        condition: service_healthy
    command: ["python", "-m", "app.messaging.setup_topology"]
  api:
    build:
      context: .
      target: api
    env_file: .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/ai_support_agent
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      DOCUMENT_STORAGE_DIR: /app/uploads/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq-setup:
        condition: service_completed_successfully
      kafka-setup:
        condition: service_completed_successfully
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    volumes:
      - uploads_data:/app/uploads
  worker:
    build:
      context: .
      target: worker
    stop_grace_period: 30m
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/ai_support_agent
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
      DOCUMENT_STORAGE_DIR: /app/uploads/documents
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq-setup:
        condition: service_completed_successfully
    volumes:
      - uploads_data:/app/uploads
  ticket-worker:
    build:
      context: .
      target: base
    stop_grace_period: 30m
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://app:app@db:5432/ai_support_agent
      RABBITMQ_URL: amqp://app:app@rabbitmq:5672/
    depends_on:
      migrate:
        condition: service_completed_successfully
      rabbitmq-setup:
        condition: service_completed_successfully
    command: ["python", "-m", "app.ticket_worker"]
  ticket-notifications:
    build:
      context: .
      target: base
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    restart: on-failure
    command: ["python", "-m", "app.kafka_worker", "ticket-notifications"]
  ticket-metrics:
    build:
      context: .
      target: base
    env_file: .env
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    depends_on:
      kafka-setup:
        condition: service_completed_successfully
    restart: on-failure
    command: ["python", "-m", "app.kafka_worker", "ticket-metrics"]

volumes:
  postgres_data:
  rabbitmq_data:
  kafka_data:
  uploads_data:
